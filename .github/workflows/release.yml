name: Release

# Push a tag v<VERSION_NAME> (matching gradle.properties) to upload the engine to the Maven Central portal.
# The deployment then waits in https://central.sonatype.com/publishing/deployments for a manual "Publish":
# a Maven Central release can never be changed or removed, so the last step stays a human decision.
on:
  push:
    tags: ["v*"]

jobs:
  maven-central:
    # macOS, so the iOS klibs are compiled natively rather than cross-compiled.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag matches VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version"
            exit 1
          fi
      - name: Tests
        run: ./gradlew :engine:allTests
      - name: Upload to the Central Portal
        run: ./gradlew :engine:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
